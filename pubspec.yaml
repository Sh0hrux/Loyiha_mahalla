name: mahalla_app
description: Mahalla qo'mitasi rasmiy mobil ilovasi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.0.0
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  
  # Maps
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  
  # PDF & Export
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  excel: ^4.0.3
  
  # Other
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  # Localization
  generate: true
